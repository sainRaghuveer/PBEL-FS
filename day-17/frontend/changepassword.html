<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            background:#f4f7fb;
            color:#21272a;
        }

        header{
            position:sticky;
            top:0;
            background:#fff;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
            border-bottom:1px solid #dde1e6;
        }

        .container{
            width:92%;
            max-width:1400px;
            margin:auto;
            height:80px;
            display:flex;
            align-items:center;
            gap:25px;
        }

        .logo a{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:140px;
            height:50px;
            background:linear-gradient(135deg,#0f62fe,#0043ce);
            color:#fff;
            text-decoration:none;
            font-size:22px;
            font-weight:bold;
            border-radius:12px;
        }

        .search-box{
            flex:1;
        }

        .search-box input{
            width:100%;
            height:46px;
            border:1px solid #cfd8dc;
            border-radius:30px;
            padding:0 18px;
            outline:none;
            font-size:15px;
        }

        .search-box input:focus{
            border-color:#0f62fe;
            box-shadow:0 0 0 4px rgba(15,98,254,.12);
        }

        nav{
            margin-left:auto;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:22px;
            align-items:center;
        }

        nav a{
            text-decoration:none;
            color:#333;
            font-weight:600;
            transition:.3s;
        }

        nav a:hover{
            color:#0f62fe;
        }

        nav li:last-child a{
            background:linear-gradient(135deg,#0f62fe,#0043ce);
            color:#fff;
            padding:11px 20px;
            border-radius:30px;
        }

        main{
            display:flex;
            justify-content:center;
            align-items:center;
            padding:70px 20px;
            min-height:calc(100vh - 260px);
        }

        .card{
            width:100%;
            max-width:470px;
            background:#fff;
            border-radius:18px;
            padding:35px;
            box-shadow:0 20px 45px rgba(0,0,0,.08);
        }

        .card h2{
            text-align:center;
            margin-bottom:8px;
        }

        .card p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            font-size:14px;
        }

        .input-group input{
            width:100%;
            height:48px;
            border:1px solid #d6d6d6;
            border-radius:10px;
            padding:0 15px;
            outline:none;
            font-size:15px;
            transition:.3s;
        }

        .input-group input:focus{
            border-color:#0f62fe;
            box-shadow:0 0 0 4px rgba(15,98,254,.12);
        }

        button{
            width:100%;
            height:50px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#0f62fe,#0043ce);
            color:#fff;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(15,98,254,.25);
        }

        footer{
            background:#161616;
            color:#fff;
            margin-top:40px;
        }

        footer::before{
            content:"";
            display:block;
            height:4px;
            background:linear-gradient(90deg,#0f62fe,#4589ff,#0f62fe);
        }

        .footer-container{
            width:92%;
            max-width:1400px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:30px;
            padding:50px 0;
        }

        .footer-column h3{
            margin-bottom:18px;
        }

        .footer-column a{
            display:block;
            text-decoration:none;
            color:#c6c6c6;
            margin-bottom:12px;
        }

        .footer-column a:hover{
            color:#78a9ff;
        }

        .footer-bottom{
            text-align:center;
            padding:20px;
            border-top:1px solid rgba(255,255,255,.1);
            color:#bdbdbd;
        }

        @media(max-width:900px){

            .container{
                flex-wrap:wrap;
                height:auto;
                padding:20px 0;
            }

            .search-box{
                width:100%;
                order:3;
            }

            nav{
                width:100%;
            }

            nav ul{
                justify-content:center;
                flex-wrap:wrap;
            }

            .footer-container{
                flex-direction:column;
            }

        }
    </style>

</head>
<body>

<header>

    <div class="container">

        <div class="logo">
            <a href="#">LOGO</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search products...">
        </div>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Wishlist</a></li>
                <li><a href="#">Login / Signup</a></li>
            </ul>
        </nav>

    </div>

</header>

<main>

    <div class="card">

        <h2>Change Password</h2>

        <p>Update your account password securely.</p>

        <form id="changePasswordForm">

            <div class="input-group">
                <label>Current Password</label>
                <input
                    type="password"
                    id="oldPassword"
                    placeholder="Enter current password"
                >
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                >
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                >
            </div>

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

</main>

<footer>

    <div class="footer-container">

        <div class="footer-column">
            <h3>Company</h3>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Careers</a>
        </div>

        <div class="footer-column">
            <h3>Support</h3>
            <a href="#">Help Center</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms & Conditions</a>
        </div>

        <div class="footer-column">
            <h3>Quick Links</h3>
            <a href="#">Products</a>
            <a href="#">Cart</a>
            <a href="#">Wishlist</a>
        </div>

    </div>

    <div class="footer-bottom">
        © 2026 Your Company. All Rights Reserved.
    </div>

</footer>

</body>
<script src="changepassword.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</html>
